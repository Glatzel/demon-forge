context:
  name: ripgrep
package:
  version: "15.2.0"
  name: ${{ name }}
build:
  number: 0
requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
tests:
  - package_contents:
      bin:
        - rg
  - script: rg --help
about:
  summary: Recursive search tool for regular expression patterns
  description: >
    ripgrep recursively searches directories while respecting ignore files such
    as .gitignore. It matches regular expression patterns across files and
    compressed archives, and is written in Rust.
  repository: https://github.com/BurntSushi/ripgrep

extra:
  update: get-version-crateio -name $name
  changelog: get-changelog-github "burntsushi/ripgrep"
