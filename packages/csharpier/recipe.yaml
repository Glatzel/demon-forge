context:
  name: csharpier
  version: "1.3.0"
package:
  version: ${{ version }}
  name: ${{ name }}
source:
  - url: https://github.com/belav/csharpier/archive/refs/tags/${{ version }}.tar.gz
build:
  number: 0
  noarch: generic
requirements:
  build:
    - dotnet
  run:
    - dotnet
tests:
  - script: csharpier --help

about:
  homepage: https://csharpier.com
  summary: Opinionated code formatter for C#
  description: >
    CSharpier is an opinionated code formatter for C#. It parses code and prints
    it back using a consistent style, and can be run from the command line, as a
    build step, or through an editor integration.
  documentation: https://csharpier.com/docs/About
  repository: https://github.com/belav/csharpier
extra:
  update: get-version-github belav/$pkg_name
  changelog: get-changelog-github belav/$pkg_name
