context:
  name: esp-generate
package:
  version: "2.0.0"
  name: ${{ name }}
build:
  number: 0
requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
tests:
  - package_contents:
      bin:
        - ${{name}}
  - script: ${{name}} --help
about:
  license: MIT
  summary: Template generator for no_std applications targeting Espressif chips
  description: >
    esp-generate is a project template generator for no_std Rust applications
    targeting Espressif SoCs and modules. It provides a terminal interface and,
    with the --headless flag, a command-line interface for selecting a target
    chip and configuration options, and it can check the generated templates.
  repository: https://github.com/esp-rs/esp-generate

extra:
  update: get-version-crateio $pkg_name
  changelog: get-changelog-github "esp-rs/esp-generate"
