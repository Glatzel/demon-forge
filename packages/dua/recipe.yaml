context:
  name: dua
package:
  version: "3.0.3"
  name: ${{ name }}
build:
  number: 0
requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ stdlib('c') }}
tests:
  - package_contents:
      bin:
        - ${{ name }}
about:
  summary: View disk space usage and delete unwanted data
  description: >
    dua is a command-line tool for reporting disk usage. It shows the size of
    directories and files and provides an interactive mode for selecting and
    deleting data to free space.
  repository: https://github.com/Byron/dua-cli

extra:
  update: get-version-crateio dua-cli
  changelog: get-changelog-github byron/dua-cli v
