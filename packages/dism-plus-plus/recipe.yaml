context:
  name: dism-plus-plus
package:
  version: "10.1.1002.2"
  name: ${{ name }}
build:
  number: 7
tests:
  - package_contents:
      bin:
        - Dism++x64
about:
  homepage: https://www.chuyu.me/en/index.html
  summary: Windows system management and optimization tool
  description: >
    Dism++ is a Windows system utility that extends the built-in DISM tool. It
    can clean and optimize Windows images, remove preinstalled applications,
    manage drivers, and repair the system image.
  repository: https://github.com/Chuyu-Team/Dism-Multi-language

extra:
  update: get-version-github Chuyu-Team/Dism-Multi-language
  changelog: get-changelog-github Chuyu-Team/Dism-Multi-language v
