context:
  name: rawspeed
  version: "5.6.2"
  number: 0
recipe:
  version: ${{ version }}
  name: ${{ name }}
source:
  git: https://github.com/darktable-org/darktable.git
  tag: "release-${{ version }}"
outputs:
  - staging:
      name: ${{ name }}-build
    build:
      script:
        interpreter: ${{ "powershell" if win else "bash" }}
        file: build-${{ name }}.${{ "ps1" if win else "sh" }}
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - ${{ stdlib('c') }}
        - cmake
        - pkg-config
        - ninja

      host:

  - package:
      name: ${{ name }}-rt
    inherit: ${{ name }}-build
    requirements:
      run_exports:
        - ${{ pin_subpackage('rawspeed-rt', upper_bound='x.x') }}
    build:
      number: ${{ number }}
      files:
        - if: osx
          then: lib/*.dylib
        - if: linux
          then: lib/*.so*
        - if: win
          then:
            - Library/*.lib
            - Library/bin/*.dll
    tests:
      - package_contents:
          lib:
            - rawspeed

  - package:
      name: ${{ name }}-dev
    inherit: ${{ name }}-build
    requirements:
      host:
        - ${{ name }}-rt
      run_exports:
        - ${{ pin_subpackage('rawspeed-rt', upper_bound='x.x') }}
    build:
      number: ${{ number }}
    tests:
      - package_contents:
          include:
            - rawspeed/rawspeed.h

about:
  repository: https://github.com/darktable-org/rawspeed

extra:
  update: |
    $latest_version = get-version-github darktable-org/darktable
    "$latest_version".Replace("release-", "")
  changelog: get-changelog-github darktable-org/darktable release-
