context:
  name: sys-epic
package:
  version: "1.3.210.0"
  name: ${{ name }}
build:
  number: 0
  script:
    interpreter: powershell
    content: |
      new-item $env:PREFIX/Scripts -itemType Directory -Force -ErrorAction SilentlyContinue
      Copy-Item $env:RECIPE_DIR/install-${{name}}.ps1 $env:PREFIX/Scripts/
requirements:
  run:
    - sys-install

about:
  homepage: https://store.epicgames.com/
  summary: Launcher for the Epic Games Store and Unreal Engine
  description: >
    The Epic Games Launcher is the client application for the Epic Games
    Store and Unreal Engine. It is used to purchase, download, install and
    update games and applications, and to manage Unreal Engine versions.

extra:
  update: get-version-winget "e/EpicGames/EpicGamesLauncher"
