context:
  name: pyxis-cli
  version: "0.0.46"
package:
  version: ${{ version }}
  name: ${{ name }}
build:
  number: 0
requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
  host:
    - proj-dev
tests:
  - script: pyxis --help

about:
  summary: Command-line interface for the Pyxis coordinate library
  description: >
    Pyxis is a library for coordinate conversion and processing. This package
    provides its command-line tools for transforming and processing coordinates.
  repository: https://github.com/Glatzel/pyxis

extra:
  update: get-version-github Glatzel/pyxis
  changelog: get-changelog-github Glatzel/pyxis v
