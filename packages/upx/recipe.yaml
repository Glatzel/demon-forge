context:
  name: upx
  version: "5.2.1"
package:
  version: ${{ version }}
  name: ${{ name }}
source:
  - git: https://github.com/upx/upx.git
    tag: v${{ version }}

build:
  number: 0
requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake
    - ninja
tests:
  - package_contents:
      bin:
        - upx

about:
  homepage: https://upx.github.io
  license: GPL-2.0-or-later
  summary: Executable packer and compressor
  description: >
    UPX (Ultimate Packer for eXecutables) is an executable packer for multiple
    platforms. It compresses executable files to reduce their size and restores
    them at run time. It supports many executable formats, including Windows,
    Linux, and macOS binaries.
  repository: https://github.com/upx/upx

extra:
  update: get-version-github $pkg_name/$pkg_name
  changelog: get-changelog-github $pkg_name/$pkg_name v
