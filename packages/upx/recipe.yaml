context:
  name: upx
package:
  version: "5.2.1"
  name: ${{ name }}
source:
  url: https://github.com/upx/upx/archive/refs/tags/v${{ version }}.tar.gz
requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cmake
    - ninja
tests:
  - package_contents:
      bin:
        - upx

about:
  homepage: https://upx.github.io
  license: GPL-2.0-or-later
  summary: Ultimate Packer for Executables
  description: >
    UPX (Ultimate Packer for Executables) is a free, portable, extendable,
    high-performance executable packer. It compresses and decompresses
    executable files for multiple platforms, reducing file size while preserving
    functionality.
  documentation: https://upx.github.io/
  repository: https://github.com/upx/upx

extra:
  update: get-version-github "$name/$name"
  changelog: get-changelog-github "$name/$name"
