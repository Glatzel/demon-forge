context:
  name: cargo-shear
package:
  version: "1.14.0"
  name: ${{ name }}
build:
  number: 0
requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
tests:
  - package_contents:
      bin:
        - ${{name}}
  - script: ${{name}} --help
about:
  summary: Remove unused dependencies in a Rust project
  description: >
    cargo-shear is a Cargo subcommand that detects dependencies declared in a
    Cargo.toml but not used by the crate. It helps keep a Rust project's
    dependency list accurate and can be run as a check in continuous
    integration.
  repository: https://github.com/Boshen/cargo-shear

extra:
  update: get-version-crateio $pkg_name
  changelog: get-changelog-github Boshen/$pkg_name v
