context:
  name: codewhale
  version: "0.10.1"

package:
  version: ${{ version }}
  name: ${{ name }}
build:
  number: 2
requirements:
  build:
    - ${{compiler('rust')}}
    - ${{compiler('c')}}
    - ${{ stdlib('c') }}
    - ${{ "pkg-config" if linux }}
  host:
    - ${{ "dbus" if linux }}
tests:
  - package_contents:
      bin:
        - codewhale

about:
  repository: https://github.com/codewhale-hq/CodeWhale
extra:
  update: get-version-crateio -name codewhale-cli
  changelog: get-changelog-github codewhale-hq/CodeWhale
