context:
  name: fd
package:
  version: "10.5.0"
  name: ${{ name }}
build:
  number: 0
requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - make
tests:
  - package_contents:
      bin:
        - ${{name}}
  - script: ${{name}} --help
about:
  summary: Command-line program to find entries in the filesystem
  description: >
    fd is a command-line program to search for files and directories. It uses
    regular expressions by default, runs searches in parallel, and provides a
    simpler syntax than the find utility.
  repository: https://github.com/sharkdp/fd

extra:
  update: get-version-crateio $pkg_name-find
  changelog: get-changelog-github sharkdp/$pkg_name v
