context:
  name: sys-tencent-docs
package:
  version: "3.11.8"
  name: ${{ name }}
build:
  number: 0
  script:
    interpreter: powershell
    content: |
      new-item $env:PREFIX/Scripts -itemType Directory -Force -ErrorAction SilentlyContinue
      Copy-Item $env:RECIPE_DIR/install-${{name}}.ps1 $env:PREFIX/Scripts/
requirements:
  run:
    - sys-install

about:
  homepage: https://docs.qq.com/
  summary: Online document and collaboration platform from Tencent
  description: >
    Tencent Docs is an online document platform from Tencent for creating,
    editing, and sharing documents, spreadsheets, and presentations. It
    supports real-time collaboration and access from desktop and mobile
    devices.

extra:
  update: get-version-winget "t/Tencent/TencentDocs"
