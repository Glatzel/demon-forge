context:
  name: zed
  version: "1.25.2"
package:
  version: ${{ version }}
  name: ${{ name }}
source:
  url: https://github.com/zed-industries/zed/archive/refs/tags/v${{ version }}.tar.gz
build:
  number: 0
requirements:
  build:
    - rust
tests:
  - package_contents:
      bin:
        - ${{ name }}

about:
  homepage: https://zed.dev
  summary: Collaborative code editor from the creators of Atom and Tree-sitter
  description: >
    Zed is a code editor for macOS, Linux, and Windows developed by the creators
    of Atom and Tree-sitter. It supports collaborative editing, AI-assisted
    coding, and multiple programming languages, and is written in Rust.
  documentation: https://zed.dev/docs
  repository: https://github.com/zed-industries/zed

extra:
  update: get-version-github ${pkg_name}-industries/zed
  changelog: get-changelog-github ${pkg_name}-industries/zed v
