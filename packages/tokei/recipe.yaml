context:
  name: tokei
  version: "15.0.0"
package:
  version: ${{ version }}
  name: ${{ name }}
source:
  url: https://github.com/XAMPPRocky/tokei/archive/refs/tags/v${{ version }}.tar.gz
build:
  number: 0
requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ stdlib('c') }}
tests:
  - package_contents:
      bin:
        - ${{ name }}
about:
  summary: Counts lines of code, comments, and blanks across many languages
  description: >
    Tokei is a program that displays statistics about source code. It reports
    the number of files, lines, code, comments, and blank lines grouped by
    language, and can output results in JSON, YAML, or CBOR. It supports over
    150 languages and is written in Rust.
  repository: https://github.com/XAMPPRocky/tokei

extra:
  update: get-version-github XAMPPRocky/$pkg_name
  changelog: get-changelog-github XAMPPRocky/$pkg_name v
