context:
  name: slumber
package:
  version: "5.4.2"
  name: ${{ name }}
build:
  number: 0
requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
tests:
  - package_contents:
      bin:
        - ${{name}}
  - script: ${{name}} --help

about:
  homepage: https://slumber.lucaspickering.me
  license: MIT
  summary: Terminal-based HTTP/REST client
  description: >
    Slumber is a terminal user interface (TUI) HTTP client for defining,
    executing and sharing configurable HTTP requests. Requests are described
    in a source-controlled configuration file, and collections from other
    tools can be imported. Responses can be browsed and filtered, and requests
    can be built dynamically from files, shell commands and other requests.
  documentation: https://slumber.readthedocs.io/
  repository: https://github.com/LucasPickering/slumber

extra:
  update: get-version-crateio -name $name
  changelog: get-changelog-github -repo "LucasPickering/slumber"
