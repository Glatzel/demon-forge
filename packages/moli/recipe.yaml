context:
  name: moli
package:
  version: "1.1.20"
  name: ${{ name }}
build:
  number: 0
requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake
    - python
    - if: linux
      then:
        - clang
        - libclang
        - make
        - pkg-config
    - if: win
      then:
        - clang
  host:
    - if: linux
      then:
        - fontconfig
tests:
  - package_contents:
      bin:
        - ${{name}}
about:
  repository: https://github.com/lexmount/moli

extra:
  update: get-version-github lexmount/moli
  changelog: get-changelog-github lexmount/moli v
