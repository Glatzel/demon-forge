context:
  name: mason
  version: "0.0.5"
package:
  name: ${{ name }}
  version: ${{ version }}
source:
  url: https://github.com/Glatzel/mason/archive/refs/tags/v${{ version }}.tar.gz
build:
  number: 0
tests:
  - package_contents:
      bin:
        - ${{ name }}/install.ps1
        - ${{ name }}/*/Mason.dll

about:
  summary: A Revit plugin for automating repetitive tasks
  description: >
    Mason is a Revit plugin that provides one-click tools for common modeling
    tasks. It is built around an extensible command architecture so that
    additional tools can be added.
  repository: https://github.com/Glatzel/mason

extra:
  update: get-version-github -repo "Glatzel/$name"
  changelog: get-changelog-github "Glatzel/$name"
