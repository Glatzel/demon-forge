context:
  name: houdini-launcher
package:
  version: "22.0.368"
  name: ${{ name }}
build:
  number: 0
requirements:
  build:
    - aria2
    - vinaya-cli
    - jq
tests:
  - package_contents:
      files:
        - houdini-launcher/houdini-launcher*
about:
  repository: https://github.com/CodSpeedHQ/codspeed

extra:
  update: get-version-crateio -name $name
  changelog: echo "https://www.sidefx.com/changelog/"
