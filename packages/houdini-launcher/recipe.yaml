context:
  name: houdini-launcher
package:
  version: "22.0.471"
  name: ${{ name }}
build:
  number: 0
requirements:
  build:
    - aria2
    - vinaya-cli
    - jq
tests:
  - package_contents:
      files:
        - ${{"bin/install_houdini_launcher.sh" if linux}}
        - ${{ "houdini-launcher/bin/houdini_launcher.exe" if win}}

about:
  homepage: https://www.sidefx.com/products/houdini/
  summary: An installer and updater for SideFX Houdini
  description: >
    The Houdini Launcher is a utility from SideFX for installing and updating
    Houdini and its related products. It downloads releases, configures
    licenses, and manages which versions are installed on a system.

extra:
  update: gh api repos/sideeffects/SideFXLabs/tags --jq '.[0].name'
  changelog: echo "https://www.sidefx.com/changelog/"
