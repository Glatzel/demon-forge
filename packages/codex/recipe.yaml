context:
  name: codex
  version: "0.171.0"

package:
  version: ${{ version }}
  name: ${{ name }}
source:
  - if: win
    then:
      url: https://github.com/openai/codex/archive/refs/tags/codex-aarch64-unknown-linux-musl.tar.gz
  - if: osx
    then:
      url: https://github.com/openai/codex/releases/download/rust-v${{ version }}/codex-aarch64-apple-darwin.tar.gz
  - if: linux and x86_64
    then:
      url: https://github.com/openai/codex/releases/download/rust-v${{ version }}/codex-x86_64-unknown-linux-musl.tar.gz
  - if: linux and aarch64
    then:
      url: https://github.com/openai/codex/releases/download/rust-v${{ version }}/codex-aarch64-unknown-linux-musl.tar.gz
build:
  number: 1
requirements:
  build:
    - ${{ 'tree' if unix}}
tests:
  - package_contents:
      bin:
        - codex

about:
  repository: https://github.com/openai/codex
extra:
  update: |
    $latest_version = get-version-github openai/$pkg_name
    "$latest_version".Replace("rust-", "")
  changelog: get-changelog-github openai/codex rust-v
