context:
  name: dufs
package:
  version: "0.47.0"
  name: ${{ name }}
build:
  number: 0
requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
tests:
  - package_contents:
      bin:
        - ${{name}}
  - script: ${{name}} --help
about:
  license: MIT
  summary: File server supporting static serving, uploading, and WebDAV
  description: >
    Dufs is a file server that serves static files and allows uploading,
    downloading, searching, and editing. It also supports access control and
    WebDAV.
  repository: https://github.com/sigoden/dufs

extra:
  update: get-version-crateio -name $name
  changelog: get-changelog-github "sigoden/dufs"
