context:
  name: mqttui
  version: "0.24.0"
package:
  version: ${{ version }}
  name: ${{ name }}
source:
  url: https://github.com/EdJoPaTo/mqttui/archive/refs/tags/v${{ version }}.tar.gz
build:
  number: 0
requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
tests:
  - package_contents:
      bin:
        - ${{name}}
  - script: ${{name}} --help

about:
  summary: A terminal user interface for MQTT
  description: >
    mqttui is a terminal user interface for interacting with MQTT brokers. It
    can subscribe to topics and display incoming messages, and can publish
    messages to a broker from the command line.
  repository: https://github.com/EdJoPaTo/mqttui

extra:
  update: get-version-github EdJoPaTo/$pkg_name
  changelog: get-changelog-github EdJoPaTo/$pkg_name v
