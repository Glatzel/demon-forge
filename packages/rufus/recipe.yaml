context:
  name: rufus
package:
  version: "4.15"
  name: ${{ name }}
build:
  number: 0
tests:
  - package_contents:
      bin:
        - ${{ name }}
about:
  homepage: https://rufus.ie
  license: GPL-3.0-or-later
  summary: Utility to create bootable USB drives
  description: >
    Rufus is a utility for formatting and creating bootable USB drives, such
    as USB flash drives and memory sticks. It is commonly used to write ISO
    images to USB media to create installation media for Windows, Linux and
    other operating systems.
  repository: https://github.com/pbatard/rufus

extra:
  update: get-version-github "pbatard/$pkg_name"
  changelog: get-changelog-github "pbatard/$pkg_name" v
