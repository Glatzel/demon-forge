context:
  name: duckdb
  version: "2.0.0"
  number: 0
recipe:
  version: ${{version}}
  name: ${{ name }}
source:
  - url: https://github.com/duckdb/duckdb/archive/refs/tags/v${{ version }}.tar.gz
outputs:
  - staging:
      name: ${{name}}-build
    build:
      script:
        interpreter: ${{ "powershell" if win else "bash" }}
        file: build-${{name}}.${{ "ps1" if win else "sh" }}
    requirements:
      build:
        - ${{compiler("c")}}
        - ${{compiler("cxx")}}
        - ${{compiler("cxx")}}
        - ${{ stdlib('c') }}
        - ${{"make" if unix}}
        - cmake
        - ninja
        - python
  - package:
      name: ${{name}}-cli
    inherit: ${{ name }}-build
    build:
      number: ${{ number }}
      files:
        - if: unix
          then: bin/*
        - if: win
          then: Library/bin/*.exe
    tests:
      - package_contents:
          bin:
            - duckdb
      - script:
          content: |
            duckdb test.duckdb -c "CREATE TABLE t (v FLOAT[3]);INSERT INTO t VALUES ([1,2,3]);COPY t TO 'test.parquet' (FORMAT parquet);"
            python -c "import polars as pl;df = pl.read_parquet('test.parquet');print(df.schema)"
        requirements:
          run:
            - polars

about:
  homepage: https://duckdb.org
  summary: In-process analytical SQL database management system
  description: >
    DuckDB is an in-process SQL database management system designed for
    analytical workloads. It runs embedded in the host process, supports the
    PostgreSQL SQL dialect, and can read and write file formats such as CSV,
    Parquet, and JSON.
  documentation: https://duckdb.org/docs/
  repository: https://github.com/duckdb/duckdb

extra:
  update: get-version-github $pkg_name/$pkg_name
  changelog: get-changelog-github $pkg_name/$pkg_name v
