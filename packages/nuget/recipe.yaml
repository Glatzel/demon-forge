context:
  name: nuget
  version: "7.9.0"
package:
  name: ${{ name }}
  version: "7.9.0"
source:
  url: https://dist.nuget.org/win-x86-commandline/latest/nuget.exe
build:
  script:
    interpreter: powershell
    content: |
      New-Item $env:PREFIX/bin -ItemType Directory
      Copy-Item "./${env:PKG_NAME}.exe" "$env:PREFIX/bin/${env:PKG_NAME}.exe"
  number: 0
tests:
  - script: ${{ name }} help
about:
  homepage: https://www.nuget.org
  license: Apache-2.0
  summary: Package manager for .NET
  description: >
    NuGet provides the tools to create, publish, and consume packages for the
    .NET platform. It handles dependency resolution and versioning for .NET
    projects across platforms.
  documentation: https://learn.microsoft.com/nuget/
  repository: https://github.com/NuGet/NuGet.Client

extra:
  update: |
    $latest_version = curl "https://dist.$pkg_name.org/index.json" | jq '.artifacts[0].versions[0].version'
    "$latest_version".Replace("""", "")
