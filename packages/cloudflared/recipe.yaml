context:
  name: cloudflared
package:
  version: "2026.10.2"
  name: ${{ name }}
build:
  number: 0
tests:
  - package_contents:
      bin:
        - ${{name}}
  - script: ${{name}} --help
about:
  license: Apache-2.0
  summary: Cloudflare Tunnel client
  description: >
    cloudflared is the client for Cloudflare Tunnel. It creates outbound-only
    connections from a private network to Cloudflare, allowing services to be
    reached over the internet without opening inbound firewall ports.
  documentation: https://developers.cloudflare.com/cloudflare-one/networks/connectors/cloudflare-tunnel/
  repository: https://github.com/cloudflare/cloudflared

extra:
  update: get-version-github -repo "cloudflare/$name"
  changelog: get-changelog-github "cloudflare/$name"
