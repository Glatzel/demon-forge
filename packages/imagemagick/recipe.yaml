context:
  name: imagemagick

package:
  name: ${{ name }}
  version: "7.1.2.35"

build:
  number: 0
tests:
  - script: magick --help
about:
  homepage: https://imagemagick.org
  license: Apache-2.0
  summary: A software suite for creating and editing bitmap images
  description: >
    ImageMagick is a free and open-source software suite for creating,
    editing, composing, or converting bitmap images. It supports over 200
    image formats and provides tools for resizing, cropping, drawing,
    filtering, and text annotation.
  documentation: https://imagemagick.org/script/index.php
  repository: https://github.com/ImageMagick/ImageMagick

extra:
  update: |
    $latest_version = get-version-github ImageMagick/ImageMagick
    "$latest_version".Replace("-", ".")
  changelog: get-changelog-github ImageMagick/ImageMagick
