context:
  name: robin-map
  version: "1.4.1"
package:
  version: ${{ version }}
  name: ${{ name }}
source:
  - url: https://github.com/Tessil/robin-map/archive/refs/tags/v${{ version }}.tar.gz
build:
  number: 0
requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake 3.*
    - ninja
tests:
  - package_contents:
      include:
        - tsl/robin_map.h
about:
  summary: C++ hash map and hash set using robin hood hashing
  description: >
    robin-map implements an open addressing hash table with robin hood hashing,
    offering fast lookup and insertion. It is distributed as a header-only
    library.
  repository: https://github.com/Tessil/robin-map

extra:
  update: get-version-github "Tessil/robin-map"
  changelog: get-changelog-github "Tessil/robin-map"
