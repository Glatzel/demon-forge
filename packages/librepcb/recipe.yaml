context:
  name: librepcb
  version: "2.1.1"
package:
  name: ${{ name }}
  version: ${{ version }}
source:
  url: https://download.librepcb.org/releases/${{ version }}/librepcb-${{ version }}-windows-x86_64.zip
build:
  number: 0
tests:
  - package_contents:
      bin:
        - ${{ name }}/bin/${{ name }}
about:
  homepage: https://librepcb.org
  license: GPL-3.0-only
  summary: A free EDA suite for developing printed circuit boards
  description: >
    LibrePCB is a free electronic design automation suite for developing
    printed circuit boards on Windows, Linux, and macOS. It is built around an
    integrated library concept and a project file format shared across
    platforms.
  documentation: https://librepcb.org/docs/
  repository: https://github.com/LibrePCB/LibrePCB

extra:
  update: get-version-github LibrePCB/LibrePCB
  changelog: get-changelog-github LibrePCB/LibrePCB
