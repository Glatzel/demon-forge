context:
  name: pureref
package:
  version: "2.1.3"
  name: ${{ name }}
build:
  number: 0
requirements:
  build:
    - selenium
    - toolbox
tests:
  - package_contents:
      bin:
        - ${{ name }}/PureRef

about:
  homepage: https://www.pureref.com
  summary: Reference image viewer and mood board tool
  description: >
    PureRef presents reference images on an infinite canvas for artists and
    designers. It supports drag-and-drop, scaling, grouping, and layering, and
    keeps references accessible while working in other applications.
  documentation: https://www.pureref.com/handbook

extra:
  update: get-version-url -url "https://www.pureref.com/download.php" -pattern 'selected value="(\d+\.\d+\.\d+)"'
