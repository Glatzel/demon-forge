context:
  name: hexyl
package:
  version: "0.17.0"
  name: ${{ name }}
build:
  number: 0
requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ stdlib('c') }}
tests:
  - script: hexyl --help

about:
  repository: https://github.com/sharkdp/hexyl

extra:
  update: get-version-crateio -name $name
  changelog: get-changelog-github sharkdp/hexyl
