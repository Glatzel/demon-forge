context:
  name: font-hack
  number: 0
  version: "3.5.1"
recipe:
  version: ${{ version }}
  name: ${{ name }}
outputs:
  - staging:
      name: ${{ name }}-build
    build:
      script:
        interpreter: bash
        file: build-${{ name }}.sh
    requirements:
      build:
        - fonttools
        - brotlipy
      ignore_run_exports:
        from_package:
          - fonttools
          - brotlipy

  - package:
      name: ${{ name }}-ttf
    inherit: ${{ name }}-build
    build:
      noarch: generic
      number: ${{ number }}
      files:
        - fonts/*.ttf
    tests:
      - package_contents:
          files:
            - fonts/*.ttf
  - package:
      name: ${{ name }}-woff2
    inherit: ${{ name }}-build
    build:
      noarch: generic
      number: ${{ number }}
      files:
        - fonts/*.woff2
    tests:
      - package_contents:
          files:
            - fonts/*.woff2
about:
  homepage: https://sourcefoundry.org/hack/
  summary: A typeface designed for source code
  description: >
    Hack is an open-source typeface designed for source code. It is derived
    from the Bitstream Vera and DejaVu font projects and is designed for
    legibility at commonly used source code text sizes.
  repository: https://github.com/source-foundry/Hack

extra:
  update: get-version-github -repo "ryanoasis/nerd-fonts"
  changelog: get-changelog-github "ryanoasis/nerd-fonts"
