context:
  name: skill-duckdb
  version: "0.0.1"
  number: 0
package:
  version: ${{version}}
  name: ${{ name }}
source:
  - url: https://github.com/duckdb/duckdb-skills/archive/refs/tags/v${{ version }}.tar.gz
build:
  number: 7
  noarch: generic
tests:
  - package_contents:
      files:
        - skills/*/SKILL.md

about:
  repository: https://github.com/duckdb/duckdb-skills

extra:
  update: echo "0.0.1"
  changelog: get-changelog-github "duckdb/duckdb-skills"
