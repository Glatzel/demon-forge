package:
  version: "0.0.1"
  name: skill-duckdb
source:
  - url: https://github.com/duckdb/duckdb-skills/archive/refs/heads/main.zip
build:
  number: 0
  noarch: generic
tests:
  - package_contents:
      files:
        - skills/*/SKILL.md
  - script: cat $PREFIX/skills/duckdb-query/SKILL.md

about:
  repository: https://github.com/duckdb/duckdb-skills

extra:
  update: echo "0.0.1"
  changelog: get-changelog-github "duckdb/duckdb-skills"
