context:
  name: cargo-espflash
package:
  version: "4.6.0"
  name: ${{ name }}
build:
  number: 0
requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
tests:
  - package_contents:
      bin:
        - ${{name}}
  - script: ${{name}} --help
about:
  license: MIT
  summary: Cargo subcommand for flashing and monitoring Espressif devices
  description: >
    cargo-espflash is a Cargo subcommand for flashing and monitoring Espressif
    microcontrollers from the command line. It supports the ESP32 family of
    devices and is part of the espflash project, which also provides a
    standalone command-line tool and a library.
  documentation: https://esp-rs.github.io/espflash
  repository: https://github.com/esp-rs/espflash

extra:
  update: get-version-crateio -name $name
  changelog: get-changelog-github esp-rs/espflash
