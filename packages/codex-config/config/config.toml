#:schema https://raw.githubusercontent.com/openinterpreter/openinterpreter/refs/heads/main/codex-rs/core/config.schema.json

[tui]
screen_reader_detection_done = true

[agents]
enabled = true
max_concurrent_threads_per_session = 2

[mcp_servers.xerj]
command = "/abs/path/to/xerj"
args = ["mcp"]

[model_providers.deepseek]
name = "deepseek"
base_url = "https://api.deepseek.com/"
wire_api = "responses"
env_key = "DEEPSEEK_API_KEY"
