context:
  name: libcap-ng
  version: "0.9.6"
  number: 0
recipe:
  version: ${{ version }}
  name: ${{ name }}
source:
  - url: https://github.com/stevegrubb/libcap-ng/archive/refs/tags/v${{ version }}.tar.gz
outputs:
  - staging:
      name: ${{ name }}-build
    build:
      script:
        - ./autogen.sh
        - ./configure --prefix=$PREFIX
        - make -j$(nproc)
        - make install
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - make
        - autoconf
        - automake
        - libtool
        - diffutils
        - pkg-config
  - package:
      name: ${{ name }}-rt
    inherit: ${{ name }}-build
    requirements:
      run_exports:
        - ${{ pin_subpackage('libcap-ng-rt', upper_bound='x.x') }}
    build:
      number: ${{ number }}
      files:
        - lib/*
    tests:
      - package_contents:
          lib:
            - libcap-ng
  - package:
      name: ${{ name }}-app
    inherit: ${{ name }}-build
    requirements:
      host:
        - ${{ name }}-rt
    build:
      number: ${{ number }}
      files:
        - bin/*
    tests:
      - package_contents:
          bin:
            - filecap
            - netcap
            - pscap
  - package:
      name: ${{ name }}-dev
    inherit: ${{ name }}-build
    requirements:
      host:
        - ${{ name }}-rt
        - ${{ name }}-app
      run_exports:
        - ${{ pin_subpackage('libcap-ng-rt', upper_bound='x.x') }}
    build:
      number: ${{ number }}
    tests:
      - package_contents:
          include:
            - cap-ng.h
about:
  summary: A library for using POSIX capabilities on Linux
  description: >
    libcap-ng is a library that simplifies programming with POSIX capabilities
    on Linux. It includes utilities such as netcap, pscap, and filecap for
    inspecting running processes and files for excessive privileges.
  repository: https://github.com/stevegrubb/libcap-ng

extra:
  update: get-version-github stevegrubb/$pkg_name
  changelog: get-changelog-github stevegrubb/$pkg_name v
