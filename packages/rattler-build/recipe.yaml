context:
  name: rattler-build
  version: "0.77.0"
package:
  version: ${{ version }}
  name: ${{ name }}
source:
  url: https://github.com/prefix-dev/rattler-build//archive/refs/tags/v${{ version }}.tar.gz
build:
  number: 0
requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ stdlib('c') }}
tests:
  - package_contents:
      bin:
        - ${{ name }}
about:
  homepage: https://rattler.build
  summary: Conda package builder
  description: >
    rattler-build builds conda packages from a recipe. It creates relocatable
    packages across platforms, produces standard conda packages that can be
    installed with pixi, mamba, or conda, and is implemented in Rust without a
    dependency on conda-build or Python.
  repository: https://github.com/prefix-dev/rattler-build

extra:
  update: get-version-github -repo "prefix-dev/rattler-build"
  changelog: get-changelog-github -repo "prefix-dev/rattler-build"
