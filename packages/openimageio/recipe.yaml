context:
  name: openimageio
  version: "3.2.1.2"
  number: 0
recipe:
  name: ${{ name }}
  version: ${{ version }}
source:
  url: https://github.com/AcademySoftwareFoundation/OpenImageIO/archive/refs/tags/v${{ version }}.tar.gz
outputs:
  - staging:
      name: openimageio-build
    build:
      script:
        interpreter: ${{ "powershell" if win else "bash" }}
        file: build-openimageio.${{ "ps1" if win else "sh" }}
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - ${{ stdlib('c') }}
        - cmake 3.*
        - ninja
        - make

      host:
        - opencolorio-dev
        - bzip2
        - fmt
        - freetype
        - ffmpeg
        - giflib
        - libheif
        - libjpeg-turbo
        - libjxl
        - openjph
        - libpng
        - libraw-dev
        - libtiff
        - libwebp
        - openexr
        - openvdb-dev
        - openjpeg
        - libopencv 4.*
        - tbb-devel
        - yaml-cpp
        - zlib
        - robin-map

  - package:
      name: openimageio-rt
    inherit: ${{ name }}-build
    requirements:
      run_exports:
        - ${{ pin_subpackage('openimageio-rt', upper_bound='x.x') }}
    build:
      number: ${{ number }}
      files:
        - if: osx
          then: lib/*.dylib
        - if: linux
          then: lib/*.so*
        - if: win
          then:
            - Library/*.lib
            - Library/bin/*.dll
  - package:
      name: openimageio-app
    inherit: ${{ name }}-build
    requirements:
      host:
        - openimageio-rt
    build:
      number: ${{ number }}
      files:
        - ${{ 'bin/*' if unix }}
        - ${{ 'Library/bin/*.exe' if win }}
    tests:
      - script:
          - oiiotool --help

  - package:
      name: openimageio-dev
    inherit: ${{ name }}-build
    requirements:
      host:
        - openimageio-rt
        - openimageio-app
      run_exports:
        - ${{ pin_subpackage('openimageio-rt', upper_bound='x.x') }}
    build:
      number: ${{ number }}

about:
  homepage: https://openimageio.org
  license: BSD-3-Clause
  summary: Image I/O and processing library
  description: >
    OpenImageIO (OIIO) reads, writes, and processes images in a wide variety of
    file formats through a format-agnostic API. It is aimed at professional
    visual effects and feature animation and includes command-line utilities
    such as oiiotool.
  documentation: https://openimageio.readthedocs.io/
  repository: https://github.com/AcademySoftwareFoundation/OpenImageIO

extra:
  update: get-version-github AcademySoftwareFoundation/OpenImageIO
  changelog: get-changelog-github AcademySoftwareFoundation/OpenImageIO v
