context:
  name: jq
package:
  version: "1.8.2"
  name: ${{ name }}
build:
  number: 0
  script:
    interpreter: powershell
    content: |
      gh release download -R "jqlang/${env:PKG_NAME}" -p "${env:PKG_NAME}-windows-amd64.exe" `
        -O  ${env:PREFIX}/bin/${env:PKG_NAME}.exe
tests:
  - package_contents:
      bin:
        - ${{name}}
  - script: ${{name}} --help

about:
  homepage: https://jqlang.org
  license: MIT
  summary: A lightweight and flexible command-line JSON processor
  description: >
    jq is a processor for JSON data that runs from the command line, written
    in portable C with no runtime dependencies. It can slice, filter, map,
    and transform structured JSON directly within a shell pipeline or script.
  documentation: https://jqlang.org/manual/
  repository: https://github.com/jqlang/jq

extra:
  update: |
    $latest_version = get-version-github jqlang/$pkg_name
    "$latest_version".Replace("$pkg_name-", "")
  changelog: get-changelog-github jqlang/$pkg_name jq-
