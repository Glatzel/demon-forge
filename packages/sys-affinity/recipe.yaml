context:
  name: sys-affinity
package:
  version: "3.3.1.4940"
  name: ${{ name }}
build:
  number: 0
  script:
    interpreter: powershell
    content: |
      new-item $env:PREFIX/Scripts -itemType Directory -Force -ErrorAction SilentlyContinue
      Copy-Item $env:RECIPE_DIR/install-${{name}}.ps1 $env:PREFIX/Scripts/
requirements:
  run:
    - sys-install

about:
  homepage: https://www.affinity.studio/
  summary: Design, photo editing and desktop publishing software
  description: >
    Affinity is a suite of design applications developed by Canva. It combines
    vector design, photo editing and desktop publishing tools in an integrated
    workflow, and is available for Windows, macOS and iPad.

extra:
  update: get-version-winget "c/Canva/Affinity"
