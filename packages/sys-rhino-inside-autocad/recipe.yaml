context:
  name: sys-rhino-inside-autocad
  version: "1.3.8"
package:
  version: ${{ version }}
  name: ${{ name }}
build:
  number: 0
  script:
    interpreter: powershell
    content: |
      new-item $env:PREFIX/Scripts -itemType Directory -Force -ErrorAction SilentlyContinue
      (Get-Content $env:RECIPE_DIR/install-${{name}}.ps1) -replace '\$template_version', "`$version=`"$env:PKG_VERSION`"" | Set-Content $env:PREFIX/Scripts/install-${{name}}.ps1
      Write-Output (Get-Content $env:PREFIX/Scripts/install-${{name}}.ps1)
requirements:
  run:
    - aria2
    - sys-install

about:
  license: MIT
  summary: Embed Rhino and Grasshopper inside Autodesk AutoCAD and Civil 3D
  description: >
    Rhino.Inside.AutoCAD embeds the Rhinoceros 3D geometry engine and the
    Grasshopper visual programming environment inside Autodesk AutoCAD and
    Civil 3D. It allows geometry to be exchanged between the applications
    without file exports, so Rhino and Grasshopper workflows can be used
    directly within the host CAD application.
  repository: https://github.com/mcneel/rhino.inside-autocad

extra:
  update: get-version-github -repo "mcneel/rhino.inside-autocad"
  changelog: get-changelog-github -repo "mcneel/rhino.inside-autocad"
