context:
  name: easytier
  version: "2.6.4"
package:
  version: ${{ version }}
  name: ${{ name }}
build:
  number: 0
requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - libprotobuf
    - if: linux
      then:
        - clang
        - libclang
        - binutils
        - mold
tests:
  - package_contents:
      bin:
        - ${{ name }}-core
        - ${{ name }}-cli
  - script: ${{ name }}-core --help
about:
  homepage: https://easytier.cn
  summary: Decentralized mesh VPN with WireGuard support
  description: >
    EasyTier is a mesh VPN that connects machines into a virtual network. It
    supports WireGuard and several routing topologies, and nodes can connect
    across NAT and firewalls using a command line, a configuration file, or a
    web interface.
  documentation: https://easytier.cn/en/
  repository: https://github.com/EasyTier/EasyTier

extra:
  update: get-version-github EasyTier/EasyTier
  changelog: get-changelog-github EasyTier/EasyTier v
