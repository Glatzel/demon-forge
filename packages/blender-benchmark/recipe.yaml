context:
  name: blender-benchmark
package:
  version: "3.3.0"
  name: ${{ name }}
build:
  number: 0
tests:
  - script:
      - benchmark-launcher-cli --help
about:
  homepage: https://opendata.blender.org
  license: GPL-3.0-or-later
  summary: Benchmark tool for measuring Blender rendering performance
  description: >
    Blender Benchmark measures the rendering speed of a system by running
    Blender scenes and reporting the results. Scores can be compared and
    uploaded to Blender Open Data, allowing hardware performance to be
    evaluated for 3D rendering workloads.
  repository: https://projects.blender.org/blender/blender-benchmark

extra:
  update: get-version-url -url "https://opendata.blender.org" -pattern 'benchmark-launcher-(\d+\.\d+\.\d+)'
