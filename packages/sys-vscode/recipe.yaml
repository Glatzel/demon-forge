context:
  name: sys-vscode
package:
  version: "1.142.0"
  name: ${{ name }}
build:
  number: 0
  script:
    interpreter: powershell
    content: |
      new-item $env:PREFIX/Scripts -itemType Directory -Force -ErrorAction SilentlyContinue
      Copy-Item $env:RECIPE_DIR/install-${{name}}.ps1 $env:PREFIX/Scripts/
requirements:
  run:
    - sys-install

about:
  homepage: https://code.visualstudio.com/
  summary: Source code editor from Microsoft
  description: >
    Visual Studio Code is a source code editor from Microsoft for Windows,
    macOS, and Linux. It provides syntax highlighting, debugging, Git
    integration, an integrated terminal, and extension support.
  documentation: https://code.visualstudio.com/docs
  repository: https://github.com/microsoft/vscode

extra:
  update: get-version-winget "m/Microsoft/VisualStudioCode"
