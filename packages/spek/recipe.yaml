context:
  name: spek
package:
  version: "0.8.5"
  name: ${{ name }}
build:
  number: 0
tests:
  - package_contents:
      bin:
        - ${{ name }}/${{ name }}
about:
  homepage: https://spek.cc
  license: GPL-3.0-or-later
  summary: Acoustic spectrum analyser for audio files
  description: >
    Spek is an acoustic spectrum analyser for audio files. It displays the
    spectrogram of a file, making it possible to inspect the frequency content
    of the audio over time. Spek uses FFmpeg for audio decoding and wxWidgets
    for the graphical user interface.
  repository: https://github.com/alexkay/spek

extra:
  update: get-version-github alexkay/$pkg_name
  changelog: get-changelog-github alexkay/$pkg_name v
