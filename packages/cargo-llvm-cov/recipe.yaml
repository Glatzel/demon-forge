context:
  name: cargo-llvm-cov
package:
  version: "0.9.1"
  name: ${{ name }}
build:
  number: 0
requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ stdlib('c') }}
tests:
  - script: ${{ name }} llvm-cov --help
about:
  license: MIT OR Apache-2.0
  summary: Cargo subcommand for LLVM source-based code coverage
  description: >
    cargo-llvm-cov is a Cargo subcommand that generates LLVM source-based code
    coverage data for Rust projects. It wraps rustc's -C instrument-coverage
    option and provides line, region, and branch coverage for tests, binaries,
    and documentation tests, with output compatible with common coverage report
    formats.
  repository: https://github.com/taiki-e/cargo-llvm-cov

extra:
  update: get-version-crateio $pkg_name
  changelog: get-changelog-github taiki-e/$pkg_name v
