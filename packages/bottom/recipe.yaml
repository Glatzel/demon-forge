context:
  name: bottom
package:
  version: "0.14.9"
  name: ${{ name }}
build:
  number: 0
requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ stdlib('c') }}
tests:
  - package_contents:
      bin:
        - btm
about:
  summary: A cross-platform graphical process and system monitor for the terminal
  description: >
    bottom is a cross-platform graphical process and system monitor that runs
    in the terminal. It displays CPU, memory, disk, network, and temperature
    usage in customizable widgets, and supports searching, sorting, and sending
    signals to processes on Linux, macOS, and Windows.
  documentation: https://bottom.pages.dev
  repository: https://github.com/ClementTsang/bottom

extra:
  update: get-version-crateio -name $name
  changelog: get-changelog-github ClementTsang/bottom
