context:
  name: cargo-fuzz
package:
  version: "0.13.2"
  name: ${{ name }}
build:
  number: 3
requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
  run:
    - if: linux
      then:
        - gcc
        - gxx
        - diffutils
    - if: win
      then:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - clang
tests:
  - package_contents:
      bin:
        - ${{name}}
  - script: ${{name}} --help

about:
  summary: A Cargo subcommand for fuzzing with libFuzzer
  description: >
    cargo-fuzz is a Cargo subcommand for fuzzing Rust code with libFuzzer. It
    creates and manages a fuzzing directory for a crate, handles corpus and
    artifact directories, and runs fuzz targets using a nightly Rust toolchain
    with sanitizer support.
  documentation: https://rust-fuzz.github.io/book/cargo-fuzz.html
  repository: https://github.com/rust-fuzz/cargo-fuzz

extra:
  update: get-version-crateio cargo-fuzz
  changelog: get-changelog-github rust-fuzz/$pkg_name
