context:
  name: xray
package:
  version: "26.3.27"
  name: ${{ name }}
build:
  number: 0
tests:
  - package_contents:
      bin:
        - xray
about:
  homepage: https://xtls.github.io
  license: GPL-3.0-only
  summary: Platform for building proxy and network tools
  description: >
    Xray-core is a platform for building proxy and networking tools based on
    the XTLS protocol. It supports multiple protocols and transports and is
    used to route and forward network traffic. It is the core engine behind
    several proxy clients.
  repository: https://github.com/XTLS/Xray-core

extra:
  update:  get-version-github XTLS/Xray-core
  changelog: get-changelog-github XTLS/Xray-core v
