context:
  name: ast-grep
package:
  version: "0.50.0"
  name: ${{ name }}
build:
  number: 0
requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
tests:
  - package_contents:
      bin:
        - ${{name}}
  - script: ${{name}} --help
about:
  homepage: https://ast-grep.github.io
  license: MIT
  summary: A CLI tool for structural code search, lint, and rewriting
  description: >
    ast-grep is a command-line tool that searches, lints, and rewrites code by
    matching abstract syntax tree (AST) patterns instead of plain text. It
    supports many programming languages, and patterns are written as ordinary
    code with meta-variables, enabling structural search and transformation
    from the command line or in editor integrations.
  documentation: https://ast-grep.github.io/guide/
  repository: https://github.com/ast-grep/ast-grep

extra:
  update: get-version-crateio -name $name
  changelog: get-changelog-github ast-grep/ast-grep
