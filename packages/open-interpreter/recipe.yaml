context:
  name: open-interpreter
  version: "0.0.55"

package:
  version: ${{ version }}
  name: ${{ name }}
source:
  url: https://github.com/openinterpreter/openinterpreter/archive/refs/tags/rust-v${{ version }}.tar.gz
build:
  number: 0
requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ stdlib('c') }}
    - python
    - ${{ "pkg-config" if linux }}
    - ${{ "patchelf"  if linux }}
    - ${{ "llvm-tools"  if win }}
  host:
    - ${{ "openssl 3.*" if linux }}
    - ${{ "libcap" if linux }}
tests:
  - package_contents:
      bin:
        - interpreter

about:
  homepage: https://openinterpreter.com
  summary: Coding agent that runs in the terminal
  description: >
    Open Interpreter is a coding agent for the terminal. It reads and edits
    files and runs commands on the user's behalf, with configurable sandbox and
    approval controls, and works with a range of model providers.
  documentation: https://docs.openinterpreter.com/
  repository: https://github.com/openinterpreter/openinterpreter
extra:
  update: |
    $latest_version = get-version-github -repo "openinterpreter/openinterpreter"
    "$latest_version".Replace("rust-", "")
  changelog: get-changelog-github openinterpreter/openinterpreter
