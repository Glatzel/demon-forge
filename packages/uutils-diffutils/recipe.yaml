context:
  name: uutils-diffutils
  version: "0.5.0"
package:
  version: ${{ version }}
  name: ${{ name }}
source:
  url: https://github.com/uutils/diffutils/archive/refs/tags/v${{ version }}.tar.gz
build:
  number: 2
requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ stdlib('c') }}
tests:
  - package_contents:
      bin:
        - diffutils
about:
  license: MIT
  summary: Rust reimplementation of the diffutils file comparison tools
  description: >
    uutils diffutils is a Rust reimplementation of the GNU diffutils commands,
    including diff, cmp, diff3, and sdiff. It compares files and reports their
    differences, and aims to be compatible with the GNU tools.
  repository: https://github.com/uutils/diffutils

extra:
  update: get-version-github uutils/diffutils
  changelog: get-changelog-github uutils/diffutils v
