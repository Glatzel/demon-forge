context:
  name: panda-cad
  version: "6.3.0.3"
package:
  version: ${{ version }}
  name: ${{ name }}
source:
  url: https://www.intrsio.com/downloadFile.jsp?fileName=PandaCAD-x64-v${{ version }}-Setup.exe
  file_name: ${{ name }}.exe
build:
  number: 0
tests:
  - package_contents:
      bin:
        - ${{ name }}/PandaCADViewer

about:
  homepage: https://www.intrsio.com
  summary: CAD drawing viewer and editor for Windows
  description: >
    PandaCAD displays and converts CAD drawings from different CAD versions. It
    provides measurement, alignment, and annotation tools and supports
    lightweight editing of text, dimensions, and geometry.

extra:
  update: get-version-url -url "https://www.intrsio.com/producterDownload/producterDownloadIndex.do" -pattern '版本：(\d+\.\d+\.\d+\.\d+)'
