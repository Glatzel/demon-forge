context:
  name: furmark
package:
  version: "2.10.2.0"
  name: ${{ name }}
build:
  number: 1
requirements:
  build:
    - selenium
    - toolbox
tests:
  - package_contents:
      bin:
        - ${{ name }}/${{ name }}
about:
  homepage: https://geeks3d.com/furmark/
  summary: A GPU stress-testing and benchmarking tool
  description: >
    FurMark is a graphics card stress test and benchmarking tool developed by
    Geeks3D. It renders a demanding 3D workload to measure performance and to
    test the stability and thermal behavior of a GPU under load.

extra:
  update: get-version-url -url "https://geeks3d.com/furmark/changelog/" -pattern 'version (\d+\.\d+\.\d+\.*\d*)'
  changelog: echo "https://geeks3d.com/furmark/changelog/"
