context:
  name: sys-dnc
package:
  version: "18.7"
  name: ${{ name }}
build:
  number: 0
  script:
    interpreter: powershell
    content: |
      new-item $env:PREFIX/Scripts -itemType Directory -Force -ErrorAction SilentlyContinue
      (Get-Content $env:RECIPE_DIR/install-${{name}}.ps1) -replace '\$template_version', "`$version=`"$env:PKG_VERSION`"" | Set-Content $env:PREFIX/Scripts/install-${{name}}.ps1
      Write-Output (Get-Content $env:PREFIX/Scripts/install-${{name}}.ps1)
requirements:
  run:
    - aria2
    - sys-install
tests:
  - script:
      interpreter: powershell
      content: |
        install-${{name}}.ps1
        ls "C:/Program Files/Adobe/Adobe DNG Converter/"
        Resolve-Path "C:/Program Files/Adobe/Adobe DNG Converter/Adobe DNG Converter.exe"
        (Get-Item "C:/Program Files/Adobe/Adobe DNG Converter/Adobe DNG Converter.exe").VersionInfo.ProductVersion

about:
  homepage: https://helpx.adobe.com/camera-raw/using/adobe-dng-converter.html
  summary: Utility to convert camera raw files to DNG
  description: >
    Adobe DNG Converter is a utility that converts camera raw files from
    supported digital cameras into the Digital Negative (DNG) format. DNG is
    an openly documented raw image format developed by Adobe that is intended
    to provide a consistent format for raw image data.

extra:
  update: get-version-text "$(curl -sIL https://www.adobe.com/go/dng_converter_win)".Replace("_", ".") 'AdobeDNGConverter.x64.(.+)\.exe'
