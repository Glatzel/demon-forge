context:
  name: sys-klite-codec-pack-full
package:
  version: "20.0.5"
  name: ${{ name }}
build:
  number: 0
  script:
    interpreter: powershell
    content: |
      new-item $env:PREFIX/Scripts -itemType Directory -Force -ErrorAction SilentlyContinue
      Copy-Item $env:RECIPE_DIR/install-${{name}}.ps1 $env:PREFIX/Scripts/
requirements:
  run:
    - sys-install

about:
  homepage: https://codecguide.com/download_k-lite_codec_pack_full.htm
  summary: Collection of DirectShow filters, VFW/ACM codecs and tools
  description: >
    The K-Lite Codec Pack is a collection of DirectShow filters, VFW/ACM
    codecs and tools distributed by Codec Guide. It provides the codecs and
    filters needed to encode and decode common audio and video formats for
    playback on Windows. The Full variant includes the standard components
    together with additional filters and Media Player Classic.

extra:
  update: get-version-winget "c/CodecGuide/K-LiteCodecPack/Full"
