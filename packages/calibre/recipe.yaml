context:
  name: calibre
package:
  version: "9.16.0"
  name: ${{ name }}
build:
  number: 0
tests:
  - package_contents:
      bin:
        - ${{ name }}/${{ name }}-portable

about:
  homepage: https://calibre-ebook.com
  license: GPL-3.0-or-later
  summary: E-book management software
  description: >
    calibre is an e-book manager that can view, convert, edit, and catalog
    e-books in the major e-book formats. It can also transfer books to e-book
    reader devices, fetch metadata from the internet, download news sources as
    e-books, and run a content server for remote access. It runs on Linux,
    Windows, and macOS.
  documentation: https://manual.calibre-ebook.com/
  repository: https://github.com/kovidgoyal/calibre

extra:
  update: get-version-github -repo "kovidgoyal/$name"
  changelog: get-changelog-github "kovidgoyal/$name"
