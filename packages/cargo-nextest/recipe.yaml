context:
  name: cargo-nextest
package:
  version: "0.9.148"
  name: ${{ name }}
build:
  number: 0
requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
tests:
  - package_contents:
      bin:
        - ${{name}}
  - script: ${{name}} --help
about:
  homepage: https://nexte.st
  license: MIT OR Apache-2.0
  summary: Test runner for Rust projects
  description: >
    cargo-nextest is a test runner for Rust that executes each test in its own
    process. It runs tests in parallel, supports filtersets for selecting which
    tests to run, and produces detailed per-test reports for local development
    and continuous integration.
  documentation: https://nexte.st/docs/
  repository: https://github.com/nextest-rs/nextest

extra:
  update: get-version-crateio -name $name
  changelog: get-changelog-github nextest-rs/nextest
