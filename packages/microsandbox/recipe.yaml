context:
  name: microsandbox
  version: "0.7.9"
  number: 0
recipe:
  version: ${{ version }}
  name: ${{ name }}

outputs:
  - package:
      name: microsandbox-libkrunfw
    source:
      - if: osx
        then:
          - url: https://github.com/superradcompany/microsandbox/releases/download/v${{ version }}/microsandbox-darwin-aarch64.tar.gz
      - if: linux and x86_64
        then:
          - url: https://github.com/superradcompany/microsandbox/releases/download/v${{ version }}/microsandbox-linux-x86_64.tar.gz
      - if: linux and aarch64
        then:
          - url: https://github.com/superradcompany/microsandbox/releases/download/v${{ version }}/microsandbox-linux-aarch64.tar.gz
    build:
      script:
        interpreter: ${{ "powershell" if win else "bash" }}
        file: build-libkrunfw.${{ "ps1" if win else "sh" }}
    requirements:
      build:
        - ${{"patchelf" if linux}}
      run_exports:
        - ${{ pin_subpackage('microsandbox-libkrunfw', upper_bound='x.x') }}
    tests:
      - package_contents:
          files:
            - bin/libkrunfw*
  - package:
      name: microsandbox
    source:
      - url: https://github.com/zerocore-ai/microsandbox/archive/refs/tags/v${{ version }}.tar.gz
    build:
      script:
        interpreter: ${{ "powershell" if win else "bash" }}
        file: build-msb.${{ "ps1" if win else "sh" }}

    requirements:
      build:
        - ${{ compiler("rust") }}
        - ${{ compiler("c") }}
        - ${{ stdlib("c") }}
        - pkg-config
      host:
        - ${{ "libcap-ng-dev" if linux }}
        - microsandbox-libkrunfw
    tests:
      - package_contents:
          bin:
            - msb
      - script:
          - msb --help
          - msb run --help
about:
  homepage: https://microsandbox.dev
  summary: A microVM runtime for running untrusted workloads
  description: >
    Microsandbox is a local-first runtime and library that runs workloads in
    hardware-isolated microVMs, each with its own kernel. It is intended for
    executing untrusted code and AI agent workloads, and supports OCI images.
  documentation: https://docs.microsandbox.dev/
  repository: https://github.com/zerocore-ai/microsandbox

extra:
  update: get-version-github superradcompany/$pkg_name
  changelog: get-changelog-github superradcompany/$pkg_name v
