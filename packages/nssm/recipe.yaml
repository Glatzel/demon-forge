context:
  name: nssm
  version: "2.24"
package:
  name: ${{ name }}
  version: ${{ version }}
source:
  url: https://nssm.cc/release/nssm-${{ version }}.zip
build:
  number: 0
  script:
    interpreter: powershell
    content: |
      New-Item $env:PREFIX/bin -ItemType Directory
      Copy-Item "./Win64/${env:PKG_NAME}.exe" "$env:PREFIX/bin/${env:PKG_NAME}.exe"
tests:
  - package_contents:
      bin:
        - ${{ name }}

about:
  homepage: https://nssm.cc
  summary: Utility for running programs as Windows services
  description: >
    NSSM (the Non-Sucking Service Manager) wraps an arbitrary program so it can
    run as a native Windows service. It monitors the managed process, restarts
    it if it exits, and can redirect its output to files.

extra:
  update: get-version-url -url "https://nssm.cc/download" -pattern 'nssm (\d+\.\d+)'
