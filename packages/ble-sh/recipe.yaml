context:
  name: ble-sh
  version: "0.4.0"
package:
  version: ${{ version }}
  name: ${{ name }}
build:
  number: 0
  script: |
    git clone --recursive --depth 1 --shallow-submodules https://github.com/akinomyoga/ble.sh.git
    make -C ble.sh install PREFIX=$PREFIX
requirements:
  build:
    - make
    - gawk
tests:
  - package_contents:
      files:
        exists:
          - share/blesh/ble.sh
about:
  summary: A line editor for interactive Bash sessions
  description: >
    ble.sh is a line editor written in pure Bash that adds syntax highlighting,
    auto suggestions, and vi editing modes to interactive Bash sessions. It
    replaces the default GNU Readline line editor and also provides completion
    and other command-line editing utilities.
  documentation: https://github.com/akinomyoga/ble.sh/wiki
  repository: https://github.com/akinomyoga/ble.sh

extra:
  update: |
    $latest_version = get-version-github -repo "akinomyoga/ble.sh"
    $latest_version.Split('-')[0]
  changelog: get-changelog-github akinomyoga/ble.sh
