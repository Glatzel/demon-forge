context:
  name: tombi
  version: "1.8.7"
package:
  version: ${{ version }}
  name: ${{ name }}
source:
  url: https://github.com/tombi-toml/tombi/archive/refs/tags/v${{ version }}.tar.gz
build:
  number: 0
requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ stdlib('c') }}
tests:
  - package_contents:
      bin:
        - ${{ name }}
about:
  homepage: https://tombi-toml.github.io/tombi/
  summary: TOML formatter, linter, and language server
  description: >
    Tombi is a toolkit for working with TOML files. It provides a formatter, a
    linter, and a language server, and can validate and format TOML using JSON
    schemas. It is written in Rust.
  repository: https://github.com/tombi-toml/tombi

extra:
  update: get-version-github "tombi-toml/tombi"
  changelog: get-changelog-github -repo "tombi-toml/tombi"
