context:
  name: msedit
  version: "2.0.0"
package:
  version: ${{ version }}
  name: ${{ name }}
source:
  - url: https://github.com/microsoft/edit/archive/refs/tags/v${{ version }}.tar.gz
build:
  number: 0
requirements:
  build:
    - ${{compiler("rust")}}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - rust-src
  host:
    - icu
tests:
  - package_contents:
      bin:
        - edit
about:
  license: MIT
  summary: A command-line text editor
  description: >
    Edit is a text editor for the terminal. It is modeled on the classic
    MS-DOS Editor while using interface and input controls similar to Visual
    Studio Code, with a focus on accessibility for users unfamiliar with
    terminal editors.
  documentation: https://learn.microsoft.com/en-us/windows/edit/
  repository: https://github.com/microsoft/edit

extra:
  update: get-version-github microsoft/edit
  changelog: get-changelog-github microsoft/edit v
