context:
  name: bitcomet
package:
  version: "2.22.9.4"
  name: ${{ name }}
build:
  number: 0

tests:
  - package_contents:
      bin:
        - ${{ name }}/BitComet
about:
  homepage: https://www.bitcomet.com
  summary: BitTorrent, HTTP, and FTP download client
  description: >
    BitComet is a download client that supports the BitTorrent, HTTP, and FTP
    protocols. It offers simultaneous downloads, a download queue, selective
    downloading of files inside a torrent, disk caching, proxy support, IP
    filtering, and port mapping.

extra:
  update: get-version-url -url "https://www.kisssub.org/rss-bitcomet.xml" -pattern 'build (\d+\.\d+\.\d+\.\d+)'
