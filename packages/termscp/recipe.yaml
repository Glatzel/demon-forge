context:
  name: termscp
  version: "1.2.0"
package:
  version: ${{ version }}
  name: ${{ name }}
source:
  url: https://github.com/veeso/termscp/archive/refs/tags/v${{ version }}.tar.gz
build:
  number: 0
requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cmake 3.30.*
    - make
    - nasm
    - pkg-config
tests:
  - package_contents:
      bin:
        - ${{name}}
  - script: ${{name}} --help
about:
  homepage: https://termscp.rs
  license: MIT
  summary: Terminal file transfer and explorer
  description: >
    Termscp is a terminal user interface application for transferring files and
    browsing remote file systems. It supports SCP, SFTP, FTP, FTPS, S3, SMB,
    WebDAV, and other protocols, and runs on Linux, macOS, BSD, and Windows.
  documentation: https://docs.termscp.rs
  repository: https://github.com/veeso/termscp

extra:
  update: get-version-crateio $name
  changelog: get-changelog-github "veeso/$name"
