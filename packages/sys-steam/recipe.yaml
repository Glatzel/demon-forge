context:
  name: sys-steam
package:
  version: "2.10.91.91"
  name: ${{ name }}
build:
  number: 0
  script:
    interpreter: powershell
    content: |
      new-item $env:PREFIX/Scripts -itemType Directory -Force -ErrorAction SilentlyContinue
      Copy-Item $env:RECIPE_DIR/install-${{name}}.ps1 $env:PREFIX/Scripts/
requirements:
  run:
    - sys-install

about:
  homepage: https://store.steampowered.com/
  summary: Digital distribution platform for video games
  description: >
    Steam is a digital distribution service and storefront for video games
    operated by Valve. The client application is used to purchase, download
    and install games, keep them up to date, and access community features
    such as friends, chat and the workshop.

extra:
  update: get-version-winget "v/Valve/Steam"
