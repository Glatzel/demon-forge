context:
  name: cargo-bloat
package:
  version: "0.12.1"
  name: ${{ name }}
build:
  number: 11
requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ stdlib('c') }}
tests:
  - package_contents:
      bin:
        - ${{ name }}
about:
  summary: A tool to find what takes up space in an executable
  description: >
    cargo-bloat is a Cargo subcommand that analyzes the size of an executable
    and reports which functions and sections take up the most space. It
    supports ELF, Mach-O, and PE binaries and can filter results by crate or
    with regular expressions.
  repository: https://github.com/RazrFalcon/cargo-bloat

extra:
  update: get-version-crateio $pkg_name
  changelog: get-changelog-github RazrFalcon/$pkg_name v
