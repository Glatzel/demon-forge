context:
  name: sys-wecom
package:
  version: "5.0.12.6018"
  name: ${{ name }}
build:
  number: 0
  script:
    interpreter: powershell
    content: |
      new-item $env:PREFIX/Scripts -itemType Directory -Force -ErrorAction SilentlyContinue
      Copy-Item $env:RECIPE_DIR/install-${{name}}.ps1 $env:PREFIX/Scripts/
requirements:
  run:
    - sys-install

about:
  homepage: https://work.weixin.qq.com/
  summary: Business communication and collaboration platform from Tencent
  description: >
    WeCom is Tencent's communication and collaboration platform for
    businesses. It provides messaging, video meetings, document collaboration,
    and tools for connecting with WeChat users and customers.

extra:
  update: get-version-winget "t/Tencent/WeCom"
