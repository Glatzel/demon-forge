context:
  name: hwinfo
package:
  version: "8.54"
  name: ${{ name }}
build:
  number: 0
tests:
  - package_contents:
      bin:
        - HWiNFO64

about:
  homepage: https://www.hwinfo.com
  summary: A hardware analysis and monitoring tool
  description: >
    HWiNFO is a hardware information and diagnostic tool for Windows. It
    reports detailed information about system components and provides
    real-time monitoring of sensors, along with reporting for troubleshooting
    and performance analysis.
  documentation: https://www.hwinfo.com/documentation/

extra:
  update: get-version-url -url "https://www.hwinfo.com/news.xml/" -pattern 'HWiNFO v(\d+\.\d+) released'
  changelog: echo "https://www.hwinfo.com/version-history/"
