context:
  name: dust
package:
  version: "1.2.6"
  name: ${{ name }}
build:
  number: 0
requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ stdlib('c') }}
tests:
  - package_contents:
      bin:
        - ${{ name }}
about:
  summary: Intuitive version of the du command
  description: >
    dust is a command-line tool that reports disk usage in a directory tree. It
    displays directory sizes as a sorted tree with a bar chart, making it easier
    to see which entries take up the most space.
  repository: https://github.com/bootandy/dust

extra:
  update: get-version-crateio -name du-dust
  changelog: get-changelog-github bootandy/dust
