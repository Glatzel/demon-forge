context:
  name: android-sdk-platform-tools

package:
  version: "37.0.1"
  name: ${{ name }}
source:
  - if: win
    then:
      url: https://googledownloads.cn/android/repository/platform-tools-latest-windows.zip
  - if: osx
    then:
      url: https://dl.google.com/android/repository/platform-tools-latest-darwin.zip?hl=zh-cn
  - if: linux
    then:
      url: https://dl.google.com/android/repository/platform-tools-latest-linux.zip?hl=zh-cn
requirements:
  build:
    - powershell
build:
  number: 0
  script:
    interpreter: powershell
    content: |
      New-Item $env:PREFIX/bin -ItemType Directory
      Copy-Item "./*" "$env:PREFIX/bin" -recurse

tests:
  - package_contents:
      bin:
        - adb
  - script: adb --help
about:
  homepage: https://developer.android.com/tools/releases/platform-tools
  license: Apache-2.0
  summary: Android SDK command-line tools for communicating with Android devices
  description: >
    Android SDK Platform-Tools is a component of the Android SDK that includes
    adb and fastboot, command-line tools for communicating with Android devices
    from a computer. adb installs and debugs apps, runs shell commands, and
    transfers files, while fastboot flashes firmware images to devices booted
    into fastboot mode.
  documentation: https://developer.android.com/tools/adb
extra:
  update: get-version-url -url "https://developer.android.com/tools/releases/platform-tools" -pattern '([0-9]+\.[0-9]+\.[0-9]+)'
  changelog: echo "https://developer.android.com/tools/releases/platform-tools"
