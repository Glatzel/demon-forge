context:
  name: ttyw
  version: "2026.10.11"
package:
  version: ${{ version }}
  name: ${{ name }}
source:
  url: https://github.com/Glatzel/toolbox/archive/refs/tags/v${{ version }}.tar.gz
build:
  number: 0
requirements:
  build:
    - ${{ compiler('rust') }}
tests:
  - script: ttyw --help

about:
  summary: Web terminal server that runs a shell in the browser
  description: >
    ttyw is a web-based terminal server that serves an interactive shell in the
    browser. It connects a pseudoterminal to a WebSocket endpoint and embeds
    its frontend, with options for the listening port, working directory, and
    command to run.
  repository: https://github.com/Glatzel/toolbox

extra:
  update:  get-version-github Glatzel/toolbox
  changelog: get-changelog-github Glatzel/toolbox v
