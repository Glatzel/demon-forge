context:
  name: cargo-llvm-lines
package:
  version: "0.4.48"
  name: ${{ name }}
build:
  number: 0
requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ stdlib('c') }}
tests:
  - package_contents:
      bin:
        - ${{name}}
  - script: ${{name}} --help
about:
  license: MIT
  summary: Count lines of LLVM IR per generic function
  description: >
    cargo-llvm-lines is a Cargo subcommand that measures the amount of LLVM IR
    generated for each generic function in a Rust program. It reports the
    functions that produce the most LLVM IR, which helps identify where
    monomorphization increases compile time and binary size.
  repository: https://github.com/dtolnay/cargo-llvm-lines

extra:
  update: get-version-crateio -name $name
  changelog: get-changelog-github kbknapp/cargo-llvm-lines
