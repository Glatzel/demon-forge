context:
  name: fonts-cascadia-mono
  number: 0
  version: "3.5.1"
recipe:
  version: ${{ version }}
  name: ${{ name }}
outputs:
  - staging:
      name: ${{ name }}-build
    build:
      script:
        interpreter: bash
        file: build-${{ name }}.sh
    requirements:
      build:
        - fonttools
        - brotlipy
      ignore_run_exports:
        from_package:
          - fonttools
          - brotlipy

  - package:
      name: ${{ name }}-ttf
    inherit: ${{ name }}-build
    build:
      noarch: generic
      number: ${{ number }}
      files:
        - fonts/*.ttf
    tests:
      - package_contents:
          files:
            - fonts/*.ttf

  - package:
      name: ${{ name }}-woff2
    inherit: ${{ name }}-build
    build:
      noarch: generic
      number: ${{ number }}
      files:
        - fonts/*.woff2
    tests:
      - package_contents:
          files:
            - fonts/*.woff2
about:
  summary: Monospaced font for programming and terminals
  description: >
    Cascadia Code is a monospaced font from Microsoft designed for terminals and
    code editors, and it includes programming ligatures. Cascadia Mono is the
    variant of the same typeface without programming ligatures.
  repository: https://github.com/microsoft/cascadia-code

extra:
  update: get-version-github -repo "ryanoasis/nerd-fonts"
  changelog: get-changelog-github "ryanoasis/nerd-fonts"
