context:
  name: fornax-py
  version: "0.0.17"
package:
  version: ${{ version }}
  name: ${{ name }}
source:
  url: https://github.com/Glatzel/fornax/archive/refs/tags/v${{ version }}.tar.gz
build:
  number: 0

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{"patchelf" if unix}}
  host:
    - python 3.13.*
    - pip
    - libraw-dev
  run:
    - python >= 3.13
    - lazy-loader
    - pydantic
    - msgspec

tests:
  - python:
      imports:
        - fornax

about:
  summary: A raw image processing library with Rust and Python APIs
  description: >
    Fornax is a raw image processing library that provides high-level and
    low-level APIs for decoding and post-processing camera RAW files. It
    supports built-in and custom decoders through a Rust backend and can be
    used from both Rust and Python.
  repository: https://github.com/Glatzel/fornax

extra:
  update: get-version-github -repo "Glatzel/fornax"
  changelog: get-changelog-github "Glatzel/fornax"
