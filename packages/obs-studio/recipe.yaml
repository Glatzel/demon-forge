context:
  name: obs-studio
package:
  version: "32.2.2"
  name: ${{ name }}
build:
  number: 0
tests:
  - package_contents:
      bin:
        - ${{ name }}/bin/64bit/obs64
about:
  homepage: https://obsproject.com
  license: GPL-2.0-or-later
  summary: Live streaming and screen recording suite
  description: >
    OBS Studio (Open Broadcaster Software) is a free and open-source
    application for capturing and compositing video and audio in real time. It
    mixes multiple sources and streams to platforms such as Twitch, YouTube,
    and Facebook Live.
  documentation: https://obsproject.com/kb/
  repository: https://github.com/obsproject/obs-studio

extra:
  update: get-version-github "obsproject/$name"
  changelog: get-changelog-github "obsproject/$name"
