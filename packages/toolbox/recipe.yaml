context:
  name: toolbox
  version: "2026.10.11"
package:
  version: ${{ version }}
  name: ${{ name }}
source:
  url: https://github.com/Glatzel/toolbox/archive/refs/tags/v${{ version }}.tar.gz
build:
  noarch: python
  number: 0
  script: pip install ./python -v

requirements:
  host:
    - python 3.13.*
    - pip
    - setuptools
    - wheel
  run:
    - python >= 3.13
    - lazy-loader
    - rich

tests:
  - python:
      imports:
        - toolbox

about:
  summary: Collection of reusable Python and Rust utilities
  description: >
    Toolbox is a workspace of small, focused libraries and command-line tools
    for systems development, data processing, and developer tooling. Its
    components are written mainly in Rust and Python and are designed to be
    reusable building blocks.
  repository: https://github.com/Glatzel/toolbox

extra:
  update: get-version-github Glatzel/$pkg_name
  changelog: get-changelog-github Glatzel/$pkg_name v
