context:
  name: skill-moli
  version: "1.1.21"
package:
  version: ${{ version }}
  name: ${{ name }}
source:
  - url: https://github.com/lexmount/moli/archive/refs/tags/v${{ version }}.tar.gz
build:
  number: 0
  noarch: generic
tests:
  - package_contents:
      files:
        - skills/*/SKILL.md
about:
  repository: https://github.com/lexmount/moli

extra:
  update: get-version-github lexmount/moli
  changelog: get-changelog-github lexmount/moli v
