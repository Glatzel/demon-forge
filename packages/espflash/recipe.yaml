context:
  name: espflash
package:
  version: "4.7.0"
  name: ${{ name }}
build:
  number: 0
requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
tests:
  - package_contents:
      bin:
        - ${{name}}
  - script: ${{name}} --help
about:
  license: MIT
  summary: Serial flasher utility for Espressif SoCs and modules
  description: >
    espflash is a command-line tool for flashing firmware to Espressif SoCs and
    modules. It supports automatic detection of connected boards, configuration
    of flash parameters, and verification of flashed data.
  documentation: https://esp-rs.github.io/espflash/
  repository: https://github.com/esp-rs/espflash

extra:
  update: get-version-crateio $pkg_name
  changelog: get-changelog-github esp-rs/$pkg_name v
