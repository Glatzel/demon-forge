context:
  name: cpu-z
package:
  version: "2.21"
  name: ${{ name }}
build:
  number: 0
tests:
  - package_contents:
      bin:
        - cpuz_x64
about:
  homepage: https://www.cpuid.com/softwares/cpu-z.html
  summary: System profiling and monitoring tool for Windows
  description: >
    CPU-Z is a utility that gathers information about a computer's processor,
    motherboard, memory, and other hardware components. It reports technical
    specifications and monitors values such as core voltage, clock speed, and
    temperature in real time.

extra:
  update: |
    [Version](get-version-url -url "https://www.cpuid.com/softwares/cpu-z.html" -pattern 'cpu-z_(\d+(?:\.\d+)+)-en.zip')
  changelog: echo "https://www.cpuid.com/softwares/cpu-z.html#version-history"
