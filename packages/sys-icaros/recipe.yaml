context:
  name: sys-icaros
package:
  version: "3.3.6.0"
  name: ${{ name }}
build:
  number: 0
  script:
    interpreter: powershell
    content: |
      new-item $env:PREFIX/Scripts -itemType Directory -Force -ErrorAction SilentlyContinue
      Copy-Item $env:RECIPE_DIR/install-${{name}}.ps1 $env:PREFIX/Scripts/
requirements:
  run:
    - sys-install

about:
  homepage: https://github.com/Xanashi/Icaros
  summary: Windows shell extensions for thumbnails and file properties
  description: >
    Icaros is a collection of Windows Shell Extensions developed by Tabibito
    Technology. It provides Windows Explorer thumbnails for video formats
    supported by FFmpeg and uses custom parsers to generate cover art
    thumbnails for formats such as MKV, FLAC and APE. It also provides
    Explorer file properties for a range of media file types.

extra:
  update: |
    $latest_version=get-version-winget "x/Xanashi/Icaros"
    "$latest_version".replace("000","0")
