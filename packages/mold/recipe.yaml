context:
  name: mold
  version: "3.0.0"
package:
  version: ${{ version }}
  name: ${{ name }}
source:
  url: https://github.com/rui314/mold/archive/refs/tags/v${{ version }}.tar.gz
build:
  number: 0
requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
tests:
  - package_contents:
      bin:
        - ${{name}}
  - script: ${{name}} --help

about:
  summary: A linker for Unix-like operating systems
  description: >
    mold is a linker for Unix-like operating systems designed as a drop-in
    replacement for existing linkers, with a focus on link speed. It supports
    architectures including x86-64, ARM, RISC-V, PowerPC, s390x, and
    LoongArch.
  repository: https://github.com/rui314/mold

extra:
  update: get-version-github rui314/$pkg_name
  changelog: get-changelog-github rui314/$pkg_name v
