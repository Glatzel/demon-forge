context:
  name: cargo-binutils
package:
  version: "0.4.0"
  name: ${{ name }}
build:
  number: 5
requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ stdlib('c') }}
tests:
  - script: cargo-size --help

about:
  license: MIT OR Apache-2.0
  summary: Cargo subcommands for the LLVM tools shipped with Rust
  description: >
    cargo-binutils provides Cargo subcommands that invoke the LLVM tools
    shipped with the Rust toolchain, such as llvm-objdump, llvm-nm, and
    llvm-size. Rust symbols in the output are automatically demangled, and the
    artifact path can be omitted when using the tools in build-and-inspect
    mode.
  repository: https://github.com/rust-embedded/cargo-binutils

extra:
  update: get-version-crateio $pkg_name
  changelog: get-changelog-github rust-embedded/$pkg_name v
