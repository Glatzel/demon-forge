context:
  name: cargo-unused-features
package:
  version: "0.2.0"
  name: ${{ name }}
build:
  number: 8
requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - if: linux
      then:
        - pkg-config
        - openssl
  host:
    - ${{ 'openssl' if linux }}

tests:
  - package_contents:
      bin:
        - ${{name}}
  - script: ${{name}} --help
about:
  license: MIT
  summary: Find unused enabled Cargo features and prune them
  description: >
    cargo-unused-features is a Cargo subcommand that finds enabled Cargo feature
    flags that are not used by a Rust project. It reports these features and can
    generate a pruned manifest with the unused flags removed.
  repository: https://github.com/TimonPost/cargo-unused-features

extra:
  update: get-version-crateio $pkg_name
  changelog: get-changelog-github taiki-e/$pkg_name
