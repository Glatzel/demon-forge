context:
  name: eza
package:
  version: "0.23.5"
  name: ${{ name }}
build:
  number: 0
requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
tests:
  - package_contents:
      bin:
        - ${{name}}
  - script: ${{name}} --help
about:
  homepage: https://eza.rocks
  summary: Modern replacement for ls
  description: >
    eza is a command-line tool for listing files. It displays file metadata with
    colour and icons, tracks Git status, and can render directories as a tree.
  repository: https://github.com/eza-community/eza

extra:
  update: get-version-crateio -name $name
  changelog: get-changelog-github "eza-community/eza"
