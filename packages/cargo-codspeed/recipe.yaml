context:
  name: cargo-codspeed
package:
  version: "6.0.0"
  name: ${{ name }}
build:
  number: 0
requirements:
  build:
    - ${{ compiler('rust') }}
tests:
  - package_contents:
      bin:
        - ${{name}}
about:
  homepage: https://codspeed.io
  summary: Cargo subcommand for building benchmark executables for CodSpeed
  description: >
    cargo-codspeed is a Cargo extension for building benchmarks that run on the
    CodSpeed performance testing platform. It compiles benchmark targets into
    executables that CodSpeed measures to detect performance regressions,
    typically in continuous integration.
  documentation: https://docs.codspeed.io/
  repository: https://github.com/CodSpeedHQ/codspeed

extra:
  update: get-version-crateio -name $name
  changelog: get-changelog-github CodSpeedHQ/codspeed
