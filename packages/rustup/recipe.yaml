context:
  name: rustup
  version: "1.29.2"
package:
  version: ${{ version }}
  name: ${{ name }}
source:
  url: https://github.com/rust-lang/rustup/archive/refs/tags/${{ version }}.tar.gz
build:
  number: 0
requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - pkg-config
    - ${{'perl' if linux}}
    - ${{'make' if linux}}
tests:
  - package_contents:
      files:
        - .cargo/bin/rustup*

  - script:
    - rustup install stable
    - cargo --help

about:
  homepage: https://rustup.rs
  summary: Installer and updater for the Rust toolchain
  description: >
    rustup is the installer and version management tool for the Rust
    programming language. It installs and updates the Rust toolchain, manages
    multiple toolchains and targets, and provides the standard Rust tools such
    as cargo and rustc.
  documentation: https://rust-lang.github.io/rustup/
  repository: https://github.com/rust-lang/rustup

extra:
  update: |
    $repoUrl = "https://github.com/rust-lang/rustup.git"
    $latest = git ls-remote --tags --refs $repoUrl |
    ForEach-Object {
        ($_ -split "`t")[1] -replace '^refs/tags/', ''
    } |
    Sort-Object { [version]$_ } |
    Select-Object -Last 1
    $latest
  changelog: get-changelog-github "rust-lang/rustup"
