context:
  name: rustup
  version: "1.29.1"
package:
  version: ${{ version }}
  name: ${{ name }}
source:
  url: https://github.com/rust-lang/rustup/archive/refs/tags/${{ version }}.tar.gz
build:
  number: 1
requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - pkg-config
    - ${{'perl' if linux}}
    - ${{'make' if linux}}
tests:
  - package_contents:
      bin:
        - rustup
  - script:
    - rustup install stable
    - cargo --help

about:
  repository: https://github.com/rust-lang/rustup

extra:
  update: |
    $repoUrl = "https://github.com/rust-lang/rustup.git"
    $latest = git ls-remote --tags --refs $repoUrl |
    ForEach-Object {
        ($_ -split "`t")[1] -replace '^refs/tags/', ''
    } |
    Sort-Object { [version]$_ } |
    Select-Object -Last 1
    $latest
  changelog: get-changelog-github "rust-lang/rustup"
