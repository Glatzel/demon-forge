context:
  name: peazip
package:
  version: "11.4.0"
  name: ${{ name }}
build:
  number: 0
tests:
  - package_contents:
      bin:
        - ${{ name }}/pea

about:
  homepage: https://peazip.github.io
  license: LGPL-3.0-or-later
  summary: File archiver and archive manager
  description: >
    PeaZip creates and extracts archives across platforms, supporting a wide
    range of formats including ZIP, 7Z, RAR, and TAR. It offers a graphical
    interface with support for encryption and other archive operations.
  documentation: https://peazip.github.io/peazip-help.html
  repository: https://github.com/peazip/PeaZip

extra:
  update: get-version-github "peazip/PeaZip"
  changelog: get-changelog-github "peazip/PeaZip"
