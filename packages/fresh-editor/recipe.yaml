context:
  name: fresh-editor
package:
  version: "0.5.3"
  name: ${{ name }}
build:
  number: 0
requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - if: linux
      then:
        - clang
        - libclang
tests:
  - script: fresh --help
about:
  homepage: https://getfresh.dev/
  license: MIT
  summary: A terminal-based text editor written in Rust
  description: >
    Fresh is a full-featured text editor for the terminal. It provides
    familiar keybindings, mouse support, menus, and a command palette, along
    with language server integration and support for large files.
  documentation: https://getfresh.dev/docs
  repository: https://github.com/sinelaw/fresh

extra:
  update: get-version-crateio $pkg_name
  changelog: get-changelog-github sinelaw/fresh v
